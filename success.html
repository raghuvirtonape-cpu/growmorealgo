<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success - Growmore Algo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{max-width:440px;width:92%;padding:32px 16px;text-align:center}
.card{background:#121212;border:1px solid #222;border-radius:16px;padding:28px}
.license{word-break:break-all;background:#000;border:1px dashed #333;padding:12px;border-radius:8px;margin:16px 0;font-family:monospace;font-size:12px;color:#00ff88}
button{width:100%;padding:14px;border-radius:8px;background:#fff;color:#000;font-weight:800;border:none;cursor:pointer}
.error{color:#ff4444}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h2 id="title">Verifying Payment...</h2>
<p id="desc">Please wait, we are verifying your transaction with Razorpay</p>
<div id="licenseBox" style="display:none">
<p>Your License Key:</p>
<div id="license" class="license"></div>
<button onclick="copyLicense()">Copy License</button>
<p style="font-size:12px;color:#888;margin-top:16px">Add this in TradingView indicator settings</p>
</div>
<p id="err" class="error"></p>
</div>
</div>
<script>
async function verify(){
 const params=new URLSearchParams(window.location.search);
 const txn=params.get('txn');
 const product=params.get('product')||'sk_course';
 if(!txn){ document.getElementById('title').textContent="Invalid Access"; document.getElementById('desc').textContent="No transaction ID found. Please pay first."; return; }
 try{
  const res=await fetch('/api/generate-license',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({txn,product})});
  const data=await res.json();
  if(data.success){
    document.getElementById('title').textContent="Payment Verified ✅";
    document.getElementById('desc').textContent="Your license is ready!";
    document.getElementById('license').textContent=data.license;
    document.getElementById('licenseBox').style.display="block";
  } else {
    document.getElementById('title').textContent="Verification Failed";
    document.getElementById('err').textContent=data.error||"Payment not verified";
  }
 }catch(e){
  document.getElementById('err').textContent="Network error, contact support with Txn ID: "+txn;
 }
}
function copyLicense(){ const t=document.getElementById('license').textContent; navigator.clipboard.writeText(t); alert("Copied!"); }
verify();
</script>
</body>
</html>
