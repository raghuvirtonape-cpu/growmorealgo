<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowmoreAlgo - DIY Algo Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:20px;display:flex;justify-content:center}
.container{max-width:440px;width:100%}
.card{background:#121212;border:1px solid #222;border-radius:12px;padding:24px;text-align:center}
.price{font-size:32px;font-weight:800;margin:16px 0}
button{width:100%;padding:16px;border-radius:8px;background:#fff;color:#000;font-weight:800;border:none;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>DIY Algo Trading Kit</h1>
<p>Build & Deploy Your Own Algos</p>
<div class="price">₹1,999</div>
<button onclick="payNow('diy_kit')">Buy DIY Kit - Secure</button>
</div>
</div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
function payNow(product){
 const options={
  key: "rzp_live_YOUR_KEY_HERE",
  amount: 199900,
  currency: "INR",
  name: "GrowmoreAlgo",
  description: product,
  handler: function(response){
    window.location.href = "/success.html?txn="+response.razorpay_payment_id+"&product="+product;
  },
  theme:{color:"#ffffff"}
 };
 const rzp=new Razorpay(options); rzp.open();
}
</script>
</body>
</html>
