<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body{font-family:Inter,sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:20px;display:flex;justify-content:center}

    .card{background:#121212;border:1px solid #222;border-radius:12px;padding:24px;text-align:center}

<body>
  <div class="container">
    <div class="card">
      <h1>Non-Coder to EA Expert</h1>
      <p>Lifetime Full Access</p>
      <ul>
        <li>Complete Pine Script to EA Course</li>
        <li>Lifetime Updates</li>

    </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function payNow(product){
      const options={
        key: "rzp_live_YOUR_KEY_HERE",
        amount: 149900,
        currency: "INR",
        name: "GrowmoreAlgo",
        description: product,
        handler: function(response){
          window.location.href = "/success.html?txn="+response.razorpay_payment_id;
        }
      };
      const rzp=new Razorpay(options);
      rzp.open();
    }
  </script>
